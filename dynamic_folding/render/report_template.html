<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>dynamic-folding · relatório</title>
<style>
:root{
  --san:'DM Sans','Segoe UI',system-ui,-apple-system,sans-serif;
  --mono:'DM Mono','Consolas','Cascadia Code',ui-monospace,monospace;
  --bg:#FAFAF8; --card:#fff; --bd:#E5E7EB; --bd2:#F1F3F4;
  --tx:#111827; --tx2:#6B7280; --tx3:#9CA3AF; --node:#374151;
  --blue:#3B82F6; --blue-l:#EFF6FF; --amber:#F59E0B; --file:#CBD5E1;
  --badge-bg:#F3F4F6;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--san);font-size:14px;background:var(--bg);color:var(--tx);
  line-height:1.5;padding:32px 20px;-webkit-font-smoothing:antialiased}
.doc{max-width:860px;margin:0 auto}
.brand{display:flex;align-items:center;gap:7px;color:var(--tx2);
  font-size:13px;font-weight:600;margin-bottom:20px}
.brand .lockup{font-size:14px;color:var(--tx);letter-spacing:-.02em;text-transform:lowercase;font-weight:400}
.brand .lockup b{font-weight:700}
.hero{margin-bottom:20px}
.hero-title{display:flex;align-items:center;gap:9px;font-size:21px;font-weight:600;
  letter-spacing:-.01em;color:var(--tx);margin-bottom:6px}
.hero-title svg{color:var(--amber)}
.hero-sum{font-size:13px;color:var(--tx2);font-weight:500}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;
  box-shadow:0 1px 2px rgba(17,24,39,.03),0 4px 16px rgba(17,24,39,.035)}
.tree{padding:8px 6px;margin-bottom:18px}
.node{display:flex;align-items:center;gap:7px;padding:4px 12px;border-radius:6px;
  color:var(--node);font-size:13px;user-select:none}
.node:hover{background:var(--blue-l)}
.node .chev{width:13px;display:inline-flex;justify-content:center;color:var(--tx3);flex-shrink:0}
.node .ico{display:inline-flex;flex-shrink:0}
.node .name{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.node.noise{color:var(--tx3)}
.node.noise .ico svg{color:var(--tx3)!important}
.pill{font-size:11px;color:var(--tx3);background:var(--badge-bg);border-radius:10px;
  padding:1px 8px;flex-shrink:0;font-variant-numeric:tabular-nums}
.node-body{display:none}
.node-body.open{display:block}
.leaf{display:flex;align-items:center;gap:7px;padding:2px 12px;color:var(--tx2)}
.leaf .ico{display:inline-flex;flex-shrink:0}
.leaf-name{font-family:var(--mono);font-size:12px;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap}
.empty{color:var(--tx3);font-style:italic;font-size:13px;padding:18px;text-align:center}
.tech{margin-bottom:18px;overflow:hidden}
.tech>summary{list-style:none;cursor:pointer;padding:13px 18px;font-size:12px;
  font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--tx3);
  display:flex;align-items:center;gap:8px}
.tech>summary::-webkit-details-marker{display:none}
.tech>summary::before{content:"";width:7px;height:7px;border-right:1.5px solid var(--tx3);
  border-bottom:1.5px solid var(--tx3);transform:rotate(-45deg);transition:transform .15s;
  margin-bottom:2px}
.tech[open]>summary::before{transform:rotate(45deg)}
.tech-body{padding:4px 18px 18px}
.stats{display:flex;flex-wrap:wrap;gap:0;border:1px solid var(--bd);border-radius:8px;
  overflow:hidden;margin-bottom:16px}
.stat{flex:1;min-width:110px;padding:12px 16px;border-right:1px solid var(--bd)}
.stat:last-child{border-right:none}
.stat-l{font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;
  color:var(--tx3);font-weight:600;margin-bottom:3px}
.stat-v{font-size:20px;font-weight:600;color:var(--tx)}
.prov{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:18px}
.badge{background:var(--bg);border:1px solid var(--bd);border-radius:7px;
  padding:5px 10px;font-size:12px;color:var(--tx2)}
.badge b{font-weight:600;color:var(--tx)}
.sub{font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;
  color:var(--tx3);margin:0 0 9px}
.timings{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:18px}
.timing{background:var(--bg);border:1px solid var(--bd);border-radius:7px;padding:7px 11px;font-size:12px}
.timing .t-s{color:var(--tx2);margin-bottom:1px}
.timing .t-v{font-weight:600;font-family:var(--mono);color:var(--tx)}
.notes{font-size:12.5px;color:var(--tx2)}
.note{padding:2px 0;display:flex;gap:7px}
.note::before{content:"→";color:var(--tx3);flex-shrink:0}
.meta{font-family:var(--mono);font-size:11.5px;color:var(--tx3);word-break:break-all;
  padding:4px 2px;margin-top:4px}
</style>
</head>
<body>
<main class="doc">
  <div class="brand" id="brand"></div>
  <section class="hero">
    <div class="hero-title" id="hero-title"></div>
    <div class="hero-sum" id="summary"></div>
  </section>
  <section class="tree card" id="tree"></section>
  <details class="tech card" id="tech">
    <summary>Detalhes técnicos</summary>
    <div class="tech-body">
      <div class="stats" id="stats"></div>
      <div class="prov" id="providers"></div>
      <div class="sub">Etapas</div>
      <div class="timings" id="timings"></div>
      <div class="sub">Notas</div>
      <div class="notes" id="notes"></div>
    </div>
  </details>
  <footer class="meta" id="meta"></footer>
</main>
<script type="application/json" id="df-data">__DF_DATA__</script>
<script>
(function(){
var raw=document.getElementById("df-data"); if(!raw)return;
var d=JSON.parse(raw.textContent);
function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}
function el(t,c){var e=document.createElement(t);if(c)e.className=c;return e;}
function plur(n,s,p){return n+" "+(n===1?s:p);}

var ICON={
 folder:'<path d="M2 6a2 2 0 012-2h4l2 2h6a2 2 0 012 2v8a2 2 0 01-2 2H4a2 2 0 01-2-2V6z"/>',
 folderOpen:'<path d="M2 6a2 2 0 012-2h4l2 2h6a2 2 0 012 2v1H2V6z"/><path d="M2 9h16l-1.5 8H3.5L2 9z"/>',
 file:'<path d="M13 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V9z"/><polyline points="13 2 13 9 20 9"/>',
 chevR:'<polyline points="9 18 15 12 9 6"/>',
 chevD:'<polyline points="6 9 12 15 18 9"/>',
 star:'<polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/>'
};
function icon(name,size,color,sw){return '<svg width="'+size+'" height="'+size+'" viewBox="0 0 24 24"'
  +' fill="none" stroke="'+color+'" stroke-width="'+(sw||1.6)+'" stroke-linecap="round"'
  +' stroke-linejoin="round">'+(ICON[name]||"")+'</svg>';}
function mark(size){return '<svg width="'+size+'" height="'+size+'" viewBox="0 0 100 100" fill="none">'
  +'<path d="M20 20H60V40H80V80H40V60H20V20Z" fill="#3B82F6" fill-opacity=".12"/>'
  +'<path d="M20 20L40 40V60H20V20Z" fill="#3B82F6" fill-opacity=".8"/>'
  +'<path d="M40 40H60V60H40V40Z" fill="#3B82F6" fill-opacity=".6"/>'
  +'<path d="M60 40H80V80H60V40Z" fill="#3B82F6"/>'
  +'<path d="M40 60H60V80H40V60Z" fill="#3B82F6" fill-opacity=".4"/></svg>';}

var STG={scanner:"Varrer estrutura",extractor:"Indexar metadados",preprocess:"Pré-processar texto",
 embedding:"Gerar vetores",reducer:"Reduzir dimensões",clustering:"Agrupar arquivos",
 naming:"Nomear categorias",proposal:"Gerar proposta"};

document.getElementById("brand").innerHTML=mark(18)+'<span class="lockup"><b>dynamic</b>folding</span>';
document.getElementById("hero-title").innerHTML=icon("star",18,"#F59E0B",1.8)
  +"<span>Proposta de organização</span>";

// Outros bucket detection (matches contract names)
function isNoise(f){return f.name==="Outros"||f.name==="_Review";}
var real=(d.folders||[]).filter(function(f){return !isNoise(f);});
var noise=(d.folders||[]).filter(isNoise);

// Summary line
function countFiles(n){var t=n.files?n.files.length:0;(n.subfolders||[]).forEach(function(s){t+=countFiles(s);});return t;}
var sum=plur(real.length,"categoria","categorias")+" · "+plur(d.file_count,"arquivo","arquivos");
if(d.noise_count>0)sum+=" · "+d.noise_count+" em Outros";
document.getElementById("summary").textContent=sum;

// Proposal tree (V1PropNode look: amber folder icon + pill badge, files on expand)
function node(n,depth,noiseNode){
  var wrap=el("div");
  var kids=(n.subfolders&&n.subfolders.length)||(n.files&&n.files.length);
  var row=el("div","node"+(noiseNode?" noise":""));
  row.style.paddingLeft=(8+depth*16)+"px";
  var open=!noiseNode;
  var label=esc(n.display_name||n.name);
  var badge=countFiles(n);
  function chev(){return kids?icon(open?"chevD":"chevR",13,"#9CA3AF",1.8):"";}
  function fico(){return icon(open?"folderOpen":"folder",15,noiseNode?"#9CA3AF":"#F59E0B",1.8);}
  function paint(){row.innerHTML='<span class="chev">'+chev()+'</span>'
    +'<span class="ico">'+fico()+'</span>'
    +'<span class="name">'+label+'</span>'
    +(badge>0?'<span class="pill">'+badge+'</span>':'');}
  paint();
  var body=el("div","node-body"+(open?" open":""));
  (n.subfolders||[]).forEach(function(s){body.appendChild(node(s,depth+1,false));});
  if(n.files&&n.files.length){n.files.forEach(function(fp){
    var lf=el("div","leaf"); lf.style.paddingLeft=(8+(depth+1)*16)+"px";
    var nm=fp.split(/[\\/]/).pop();
    lf.innerHTML='<span class="ico">'+icon("file",14,"#CBD5E1",1.8)+'</span>'
      +'<span class="leaf-name"></span>';
    var s=lf.querySelector(".leaf-name"); s.textContent=nm; s.title=fp;
    body.appendChild(lf);
  });}
  if(kids){row.style.cursor="pointer";
    row.addEventListener("click",function(){open=body.classList.toggle("open");paint();});}
  wrap.appendChild(row); wrap.appendChild(body); return wrap;
}
var tree=document.getElementById("tree");
if(real.length||noise.length){
  real.forEach(function(f){tree.appendChild(node(f,0,false));});
  noise.forEach(function(f){tree.appendChild(node(f,0,true));});
}else{ tree.innerHTML='<div class="empty">Nenhuma pasta proposta.</div>'; }

// Technical details
var stats=[{l:"Arquivos",v:d.file_count},{l:"Pastas",v:d.folder_count},
  {l:"Outros",v:d.noise_count}];
if(d.peak_memory_mb!=null)stats.push({l:"Memória",v:d.peak_memory_mb.toFixed(1)+" MB"});
var se=document.getElementById("stats");
stats.forEach(function(s){var e=el("div","stat");
  e.innerHTML='<div class="stat-l">'+esc(s.l)+'</div><div class="stat-v">'+esc(String(s.v))+'</div>';
  se.appendChild(e);});

var p=d.providers||{};
[{l:"embedding",v:p.embedding||"—"},
 {l:"naming",v:(p.naming||"—")+(p.naming_model?" · "+p.naming_model:"")},
 {l:"clustering",v:p.clustering||"—"}].forEach(function(b){
  var e=el("div","badge"); e.innerHTML=esc(b.l)+": <b>"+esc(b.v)+"</b>";
  document.getElementById("providers").appendChild(e);});

var te=document.getElementById("timings");
Object.keys(d.timings||{}).forEach(function(k){var e=el("div","timing");
  e.innerHTML='<div class="t-s">'+esc(STG[k]||k)+'</div><div class="t-v">'
    +d.timings[k].toFixed(3)+"s</div>"; te.appendChild(e);});

var ne=document.getElementById("notes");
if(d.notes&&d.notes.length){d.notes.forEach(function(n){var e=el("div","note");
  e.textContent=n; ne.appendChild(e);});}
else{ne.innerHTML='<div class="empty" style="text-align:left;padding:6px 0">Sem notas.</div>';}

document.getElementById("meta").textContent=d.root+" · "+d.timestamp+" · v"+d.version;
})();
</script>
</body>
</html>
